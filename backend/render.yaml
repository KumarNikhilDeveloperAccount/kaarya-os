databases:
  - name: kaarya-os-db
    databaseName: kaarya_os
    user: kaarya_admin
    plan: free

services:
  - type: web
    name: kaarya-os-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: kaarya-os-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: EMAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: kaarya.support@gmail.com
      - key: SMTP_PASSWORD
        value: ALksdjhfvgmz#@202
      - key: FRONTEND_BASE_URL
        value: https://frontend-two-steel-22.vercel.app

  - type: cron
    name: kaarya-social-engine
    env: python
    rootDir: backend
    schedule: "0 */8 * * *"
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: python scripts/social_automation.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: META_USERNAME
        sync: false
      - key: META_PASSWORD
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_URN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
