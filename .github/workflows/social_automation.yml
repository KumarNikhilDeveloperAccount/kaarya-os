name: Kaarya OS Social Engine

on:
  schedule:
    # Runs every 8 hours
    - cron: '0 */8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  broadcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Sessions and State
        uses: actions/cache@v3
        with:
          path: |
            backend/scripts/social_state.json
            backend/scripts/ig_session.json
            backend/scripts/playwright_session
          key: social-engine-state-${{ github.run_id }}
          restore-keys: |
            social-engine-state-

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright instagrapi tweepy google-genai schedule python-dotenv requests

      - name: Install Playwright Browsers
        run: |
          cd backend
          playwright install chromium --with-deps

      - name: Execute Social Automation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_USERNAME: ${{ secrets.META_USERNAME }}
          META_PASSWORD: ${{ secrets.META_PASSWORD }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd backend
          python scripts/social_automation.py

      - name: Save State to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch backend/scripts/social_state.json
          git add backend/scripts/social_state.json || true
          git commit -m "chore: auto-update social state [skip ci]" || echo "No changes to commit"
          git push || true
